name: CPP Terraform Azure Policy Management
trigger: none
pr:
  - master

resources:
  repositories:
    - repository: cppAzureDevOpsTemplates
      type: github
      name: hmcts/cpp-azure-devops-templates
      ref: "add-master-as-target"
      endpoint: "hmcts"

parameters:
  - name: tfversion
    default: 1.12.2
  - name: targetResources
    default: null
  - name: planEnvironments
    type: object
    default:
      - platform: nonlive
        environments:
          - nonlive
      - platform: live
        dependsOn: terraform_plan_nonlive
        environments:
          - live
  - name: enableDebug
    displayName: Enable Debug run
    type: string
    default: false
    values:
      - "true"
      - "false"

variables:
  - name: system.debug
    value: ${{ parameters.enableDebug }}

stages:
  - template: pipelines/terraform-plan-and-apply.yaml@cppAzureDevOpsTemplates
    parameters:
      planEnvironments: ${{ parameters.planEnvironments }}
      tfversion: ${{ parameters.tfversion }}
      targetResources: ${{ parameters.targetResources }}

  # Trigger compliance scan after successful apply
  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/master') }}:
      - stage: trigger_scan
        displayName: Trigger Policy State Scan
        condition: succeeded()
        pool:
          name: "ubuntu-ado-agents-mdv"
        jobs:
          - job: scan
            steps:
              - task: AzureCLI@2
                displayName: Trigger Policy State Scan - Non Live
                inputs:
                  scriptType: bash
                  azureSubscription: "ado_nonlive_workload_identity"
                  scriptLocation: inlineScript
                  inlineScript: |
                    az policy state trigger-scan --subscription 0511a7fe-771b-4ffa-9348-c59e9c4a87bd --no-wait
                    az policy state trigger-scan --subscription 8cdb5405-7535-4349-92e9-f52bddc7833a --no-wait
                    az policy state trigger-scan --subscription e6b5053b-4c38-4475-a835-a025aeb3d8c7 --no-wait
              - task: AzureCLI@2
                displayName: Trigger Policy State Scan - Live
                inputs:
                  scriptType: bash
                  azureSubscription: "ado_live_workload_identity"
                  scriptLocation: inlineScript
                  inlineScript: |
                    az policy state trigger-scan --subscription e7819cdc-66af-4611-9dba-b9958e5b6d7d --no-wait
                    az policy state trigger-scan --subscription 9ab65d81-930d-4cc0-a93d-367e14676bc0 --no-wait
